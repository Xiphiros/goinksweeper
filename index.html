<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOINKSWEEPER</title>
    <link rel="stylesheet" href="src/styles/variables.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />
    <link rel="stylesheet" href="src/styles/node.css" />
    <link rel="stylesheet" href="src/styles/market.css" />
    <style>
      .header__actions { display: flex; gap: 10px; align-items: center; }
      .header__actions-auto { 
        display: none; 
        gap: 5px; 
        border-right: 1px solid #444; 
        padding-right: 15px; 
        margin-right: 5px; 
      }
      .btn-util {
        background: #222;
        color: #888;
        border: 1px solid #444;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: bold;
      }
      .btn-util:hover { background: #333; color: white; }
      .btn-util--active { background: var(--color-primary-dim); color: white; border-color: var(--color-primary); }
      .btn-util--danger:hover { background: var(--color-danger); border-color: var(--color-danger); }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="header__stats-group">
        <div class="header__stat">
          <span class="header__stat-label">Goink Points</span>
          <span id="disp-gp" class="header__stat-value">0</span>
        </div>
        <div class="header__stat">
          <span class="header__stat-label">Logic Fidelity</span>
          <span id="disp-acc" class="header__stat-value header__stat-value--secondary">0%</span>
        </div>
      </div>
      
      <div class="header__actions">
        <div id="auto-controls" class="header__actions-auto">
          <button id="btn-auto-all" class="btn-util">Auto All</button>
          <button id="btn-auto-none" class="btn-util">Stop All</button>
        </div>
        <button id="btn-home" class="btn-util">Home</button>
        <button id="btn-reset-data" class="btn-util btn-util--danger">Wipe Data</button>
        <button id="shop-toggle" class="header__market-btn">Goink Market</button>
      </div>
    </header>

    <div id="shop-panel" class="market">
      <div class="market__header">MARKETPLACE</div>
      <div class="market__scroll-area" id="shop-list"></div>
    </div>

    <main id="viewport" class="viewport">
      <div id="world" class="viewport__world"></div>
    </main>

    <div id="ctx-menu" class="context-menu"></div>
    <div id="modal-root"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
