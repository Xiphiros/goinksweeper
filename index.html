<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOINKSWEEPER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="src/styles/variables.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />
    <link rel="stylesheet" href="src/styles/node.css" />
    <link rel="stylesheet" href="src/styles/market.css" />
    <link rel="stylesheet" href="src/styles/home.css" />
  </head>
  <body data-theme="light">
    <div id="home-screen" class="home-screen">
      <div class="home-screen__content">
        <div class="home-screen__logo-container">
          <img src="goink.png" alt="GOINK" class="home-screen__logo" />
        </div>
        <h1 class="home-screen__title">GOINKSWEEPER</h1>
        <button id="btn-start" class="home-screen__btn">GOINK!</button>
      </div>
    </div>

    <header class="header">
      <div class="header__left">
        <button id="btn-menu" class="btn-icon">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="header__stats-group">
          <div class="header__stat">
            <span class="header__stat-label">Goink Points</span>
            <span id="disp-gp" class="header__stat-value">0</span>
          </div>
          <div class="header__stat header__stat--compact">
            <span class="header__stat-label">Throughput</span>
            <div class="header__sub-stat">
              <span id="disp-gps" class="header__stat-value header__stat-value--small">0</span>
              <span class="header__unit">GPS</span>
            </div>
          </div>
          <div class="header__stat header__stat--compact">
            <span class="header__stat-label">Velocity</span>
            <div class="header__sub-stat">
              <span id="disp-rps" class="header__stat-value header__stat-value--small">0.0</span>
              <span class="header__unit">RPS</span>
            </div>
          </div>
          <div class="header__stat">
            <span class="header__stat-label">Logic Fidelity</span>
            <span id="disp-acc" class="header__stat-value header__stat-value--secondary">0%</span>
          </div>
        </div>
      </div>
      
      <div class="header__actions">
        <button id="shop-toggle" class="header__market-btn">
          <i class="fa-solid fa-store" style="margin-right: 8px;"></i> Market
        </button>
      </div>
    </header>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar__header">SYSTEM CONTROL</div>
      
      <div class="sidebar__section">
        <label class="sidebar__label">Automation</label>
        <div class="sidebar__row">
          <button id="btn-auto-all" class="btn-util">Auto All</button>
          <button id="btn-auto-none" class="btn-util">Stop All</button>
        </div>
      </div>

      <div class="sidebar__section">
        <label class="sidebar__label">Audio Levels</label>
        <div class="sidebar__slider-group">
          <div class="vol-row">
            <span>BGM</span>
            <input type="range" id="slider-bgm" min="0" max="1" step="0.01" value="0.5">
          </div>
          <div class="vol-row">
            <span>SFX</span>
            <input type="range" id="slider-sfx" min="0" max="1" step="0.01" value="1.0">
          </div>
        </div>
      </div>

      <div class="sidebar__section">
        <label class="sidebar__label">Environment</label>
        <button id="btn-theme" class="btn-util btn-block">Toggle Mode</button>
        <div class="sidebar__row">
          <button id="btn-bg-toggle" class="btn-util">Toggle BG</button>
          <button id="btn-bg-upload" class="btn-util">Set Image</button>
        </div>
        <button id="btn-bg-reset" class="btn-util btn-block">Restore Default BG</button>
        <input type="file" id="input-bg-file" hidden accept="image/*">
      </div>

      <div class="sidebar__section">
        <label class="sidebar__label">Workspace</label>
        <button id="btn-rearrange" class="btn-util btn-block">Rearrange Grid</button>
        <button id="btn-home" class="btn-util btn-block">Center View</button>
      </div>

      <div class="sidebar__section" style="margin-top: auto;">
        <button id="btn-reset-data" class="btn-util btn-util--danger btn-block">Wipe Data</button>
      </div>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div id="shop-panel" class="market">
      <div class="market__header">MARKETPLACE</div>
      <div class="market__scroll-area" id="shop-list"></div>
    </div>

    <main id="viewport" class="viewport">
      <div id="world" class="viewport__world"></div>
      <!-- Floating Camera Lock Button -->
      <button id="btn-lock-view" class="btn-floating">
        <i class="fa-solid fa-lock-open"></i>
      </button>
    </main>

    <div id="ctx-menu" class="context-menu"></div>
    <div id="modal-root"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
